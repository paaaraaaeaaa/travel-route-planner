<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics="">
<style>
body{margin:0;font-family:-apple-system,sans-serif;background:#EEEFF1}
.mp-btn{transition:background-color .15s,color .15s}
</style>
</helmet>

<div style="min-height:100vh;background:#EEEFF1;display:flex;flex-direction:column;align-items:center;padding:20px 12px 60px;box-sizing:border-box;overflow-x:hidden">

  <div style="display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:6px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)">
    <sc-for list="{{ modes }}" as="m" hint-placeholder-count="3">
      <div onClick="{{ m.onSelect }}" class="mp-btn" style="cursor:pointer;padding:8px 16px;border-radius:9px;font-size:13px;font-weight:700;background:{{ m.bg }};color:{{ m.color }}">{{ m.label }}</div>
    </sc-for>
  </div>

  <div style="display:flex;align-items:center;gap:6px;background:#fff;border-radius:12px;padding:6px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.06);flex-wrap:wrap;max-width:480px;justify-content:center">
    <sc-for list="{{ pages }}" as="p" hint-placeholder-count="8">
      <div onClick="{{ p.onSelect }}" class="mp-btn" style="cursor:pointer;padding:7px 12px;border-radius:9px;font-size:12px;font-weight:700;background:{{ p.bg }};color:{{ p.color }};white-space:nowrap">{{ p.label }}</div>
    </sc-for>
  </div>

  <div style="font-size:12px;color:#6B6C70;margin-bottom:16px">{{ widthLabel }} — PC 버전 파일(Community.dc.html)은 수정되지 않습니다. 이 프레임은 실제 화면 너비를 시뮬레이션해 반응형 CSS를 확인하는 미리보기입니다.</div>

  <div style="background:#000;border-radius:{{ frameRadius }};padding:{{ framePad }};box-shadow:0 20px 50px -10px rgba(0,0,0,.35)">
    <div style="width:{{ frameWidth }}px;height:{{ frameHeight }};border-radius:{{ screenRadius }};overflow:hidden;background:#fff">
      <iframe src="{{ pageSrc }}" onLoad="{{ onFrameLoad }}" style="width:100%;height:100%;border:none;display:block;margin:0"></iframe>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const MODES = [
  { key: 'desktop', label: 'Desktop', width: 1280, height: '760px' },
  { key: '375', label: '375px', width: 375, height: '812px' },
  { key: '390', label: '390px', width: 390, height: '844px' },
];

const PAGES = [
  { key: 'main', label: 'Main (Home)', file: 'main(home).dc.html' },
  { key: 'community', label: 'Community', file: 'Community (Mobile).dc.html' },
  { key: 'explore', label: 'Explore', file: 'Explore Destinations (Mobile).dc.html' },
  { key: 'myroutes', label: 'My Routes', file: 'My Routes (Mobile).dc.html' },
  { key: 'planner', label: 'Route Planner', file: 'Route Planner App.dc.html' },
  { key: 'login', label: 'Login', file: 'Login Screen.dc.html' },
  { key: 'signup', label: 'Signup', file: 'Signup Screen.dc.html' },
  { key: 'aiplanner', label: 'AI Schedule Planner', file: 'AI Schedule Planner.dc.html' },
  { key: 'mypage', label: 'My Page', file: 'My Page.dc.html' },
];

class Component extends DCLogic {
  state = { mode: '375', page: 'community' };

  selectMode = (key) => this.setState({ mode: key });
  selectPage = (key) => this.setState({ page: key });

  onFrameLoad = (e) => {
    try {
      const doc = e.target.contentDocument;
      if (!doc) return;
      const style = doc.createElement('style');
      style.textContent = `
        html{scrollbar-width:none;-ms-overflow-style:none}
        html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
        *{scrollbar-width:none;-ms-overflow-style:none}
        *::-webkit-scrollbar{display:none;width:0;height:0}
      `;
      doc.head.appendChild(style);
    } catch (err) {}
  };

  renderVals() {
    const active = MODES.find(m => m.key === this.state.mode) || MODES[0];
    const activePage = PAGES.find(p => p.key === this.state.page) || PAGES[0];
    const isPhone = active.key !== 'desktop';
    return {
      modes: MODES.map(m => ({
        label: m.label, onSelect: () => this.selectMode(m.key),
        bg: this.state.mode === m.key ? '#171719' : 'transparent',
        color: this.state.mode === m.key ? '#fff' : '#46474C',
      })),
      pages: PAGES.map(p => ({
        label: p.label, onSelect: () => this.selectPage(p.key),
        bg: this.state.page === p.key ? '#7BCB93' : 'transparent',
        color: this.state.page === p.key ? '#12321F' : '#46474C',
      })),
      pageSrc: `./${activePage.file}`,
      widthLabel: isPhone ? `${active.width}px × ${active.height} 기준 모바일 미리보기` : '1280px 데스크톱 미리보기',
      frameWidth: active.width,
      frameHeight: active.height,
      framePad: isPhone ? '14px' : '0px',
      frameRadius: isPhone ? '44px' : '0px',
      screenRadius: isPhone ? '30px' : '0px',
      onFrameLoad: this.onFrameLoad,
    };
  }
}
</script>
</body>
</html>
