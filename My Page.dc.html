<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<style>
  a{color:#1F7A44}
  a:hover{color:#146030}
  body{margin:0;font-family:'Pretendard',-apple-system,sans-serif}
  .mp-row{transition:background-color .12s ease}
  .mp-row:hover{background-color:{{ c.rowHover }}}
</style>
</helmet>

<div style="min-height:100vh;background:{{ c.bg }};color:{{ c.text }}">

  <div style="position:sticky;top:0;z-index:10;backdrop-filter:blur(10px);background:{{ c.headerBg }};border-bottom:1px solid {{ c.border }}">
    <div style="max-width:1200px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px">
      <a href="./main(home).dc.html" style="display:flex;align-items:center;gap:2px;font-size:20px;font-weight:800;letter-spacing:-0.02em;color:{{ c.text }};text-decoration:none">
        <span>p<span style="color:#26AB4E">:</span>nder</span>
      </a>
      <a href="./main(home).dc.html" style="font-size:13.5px;font-weight:600;color:{{ c.textSub }};text-decoration:none">← 홈으로</a>
    </div>
  </div>

  <div style="max-width:640px;margin:0 auto;padding:32px 20px 80px">
    <div style="margin-bottom:24px">
      <div style="font-size:24px;font-weight:800;letter-spacing:-0.01em">마이페이지</div>
      <div style="font-size:13.5px;color:{{ c.textSub }};margin-top:4px">내 계정과 서비스 설정을 관리해요</div>
    </div>

    <div style="display:flex;align-items:center;gap:14px;padding:18px;border:1px solid {{ c.border }};border-radius:16px;background:{{ c.cardBg }};margin-bottom:28px">
      <div style="width:48px;height:48px;border-radius:50%;background:#F2F6ED;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">👤</div>
      <div style="min-width:0">
        <div style="font-size:15px;font-weight:700">{{ user.nickname }}</div>
        <div style="font-size:12.5px;color:{{ c.textSub }};margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ user.email }}</div>
      </div>
    </div>

    <div style="font-size:12px;font-weight:700;color:{{ c.textSub }};letter-spacing:.04em;margin-bottom:8px;padding:0 4px">계정 설정</div>
    <div style="border:1px solid {{ c.border }};border-radius:14px;background:{{ c.cardBg }};overflow:hidden;margin-bottom:24px">
      <div class="mp-row" onClick="{{ onEditNickname }}" style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;border-bottom:1px solid {{ c.border }}">
        <div>
          <div style="font-size:11.5px;color:{{ c.textSub }};margin-bottom:2px">닉네임</div>
          <div style="font-size:14px;font-weight:600">{{ user.nickname }}</div>
        </div>
        <div style="color:{{ c.textSub }};font-size:16px">›</div>
      </div>
      <div class="mp-row" onClick="{{ onEditEmail }}" style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer">
        <div>
          <div style="font-size:11.5px;color:{{ c.textSub }};margin-bottom:2px">이메일</div>
          <div style="font-size:14px;font-weight:600">{{ user.email }}</div>
        </div>
        <div style="color:{{ c.textSub }};font-size:16px">›</div>
      </div>
    </div>

    <div style="font-size:12px;font-weight:700;color:{{ c.textSub }};letter-spacing:.04em;margin-bottom:8px;padding:0 4px">서비스 설정</div>
    <div style="border:1px solid {{ c.border }};border-radius:14px;background:{{ c.cardBg }};overflow:hidden;margin-bottom:24px">
      <div class="mp-row" onClick="{{ onNotificationSettings }}" style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;border-bottom:1px solid {{ c.border }}">
        <div style="font-size:14px;font-weight:600">알림 설정</div>
        <div style="color:{{ c.textSub }};font-size:16px">›</div>
      </div>
      <div class="mp-row" onClick="{{ onTerms }}" style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer">
        <div style="font-size:14px;font-weight:600">약관 및 개인정보</div>
        <div style="color:{{ c.textSub }};font-size:16px">›</div>
      </div>
    </div>

    <div style="font-size:12px;font-weight:700;color:{{ c.textSub }};letter-spacing:.04em;margin-bottom:8px;padding:0 4px">계정 관리</div>
    <div style="border:1px solid {{ c.border }};border-radius:14px;background:{{ c.cardBg }};overflow:hidden">
      <div class="mp-row" onClick="{{ onOpenWithdraw }}" style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer">
        <div style="font-size:14px;font-weight:600;color:{{ c.dangerText }}">회원 탈퇴</div>
        <div style="color:{{ c.dangerText }};font-size:16px;opacity:.6">›</div>
      </div>
    </div>
  </div>

  <sc-if value="{{ withdrawOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;background:rgba(23,23,25,.4);z-index:49;display:flex;align-items:center;justify-content:center;padding:20px" onClick="{{ onCloseWithdraw }}">
      <div style="width:340px;max-width:100%;background:{{ c.cardBg }};border-radius:16px;padding:22px;box-shadow:0 20px 50px -10px rgba(0,0,0,.3)" onClick="{{ stopPropagation }}">
        <div style="font-size:16px;font-weight:800;margin-bottom:8px">정말 탈퇴하시겠습니까?</div>
        <div style="font-size:13px;color:{{ c.textSub }};line-height:1.5;margin-bottom:18px">회원 탈퇴 기능은 준비 중입니다. 실제 탈퇴 처리는 다음 단계에서 연결됩니다.</div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <div onClick="{{ onCloseWithdraw }}" style="padding:9px 16px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;border:1px solid {{ c.border }};color:{{ c.text }}">취소</div>
        </div>
      </div>
    </div>
  </sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { theme: (typeof localStorage !== 'undefined' && localStorage.getItem('pd-theme')) || 'light', withdrawOpen: false };
  onOpenWithdraw = () => this.setState({ withdrawOpen: true });
  onCloseWithdraw = () => this.setState({ withdrawOpen: false });
  stopPropagation = (e) => e && e.stopPropagation && e.stopPropagation();
  // 아직 실제 수정 화면이 없으므로 클릭 시 아무 동작 없이 UI만 유지 (다음 단계에서 연결)
  noop = () => {};

  renderVals() {
    const isDark = this.state.theme === 'dark';
    const c = isDark
      ? { bg: '#0F0F10', text: '#F7F7F8', textSub: 'rgba(247,247,248,.55)', border: '#3A3B3E', headerBg: 'rgba(15,15,16,.85)', cardBg: '#17181A', rowHover: '#1F2022', dangerText: '#E58888' }
      : { bg: '#F7F7F8', text: '#171719', textSub: 'rgba(23,23,25,.5)', border: '#E1E2E4', headerBg: 'rgba(255,255,255,.85)', cardBg: '#fff', rowHover: '#F7F7F8', dangerText: '#D9534F' };
    // 실제 인증 연결 전까지는 mock user 데이터 — 나중에 실제 로그인 사용자로 교체
    const user = { id: 'u1', nickname: '유수', email: 'yusoo@example.com' };
    return {
      c, user,
      onEditNickname: this.noop, onEditEmail: this.noop,
      onNotificationSettings: this.noop, onTerms: this.noop,
      withdrawOpen: this.state.withdrawOpen,
      onOpenWithdraw: this.onOpenWithdraw, onCloseWithdraw: this.onCloseWithdraw,
      stopPropagation: this.stopPropagation,
    };
  }
}

</script>
</body>
</html>
